name: Readest Fixed Android APK

on:
  push:
    branches:
      - fix/pdf-selection-handles
    paths:
      - apps/readest-app/src/app/reader/hooks/useTextSelector.ts
      - .github/workflows/readest-fixed-android.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug-apk:
    name: Android ARM64 debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - name: Check out patched fork
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download and verify Gradle 8.14.3 before compiling
        shell: bash
        run: |
          set -euo pipefail
          zip="$RUNNER_TEMP/gradle-8.14.3-bin.zip"
          sha=bd71102213493060956ec229d946beee57158dbd89d0e62b91bca0fa2c5f3531
          for url in \
            'https://mirrors.aliyun.com/gradle/distributions/v8.14.3/gradle-8.14.3-bin.zip' \
            'https://mirrors.huaweicloud.com/gradle/gradle-8.14.3-bin.zip'; do
            echo "Trying verified Gradle mirror: $url"
            rm -f "$zip"
            if curl --fail --location --show-error --retry 2 --retry-all-errors \
              --connect-timeout 20 --max-time 600 --output "$zip" "$url"; then
              if echo "$sha  $zip" | sha256sum --check --status; then
                echo "Verified Gradle 8.14.3 archive from $url"
                exit 0
              fi
              echo "::warning::Gradle download failed SHA-256 verification"
            fi
          done
          echo "::error::Cannot fetch checksum-verified Gradle 8.14.3 from independent mirrors"
          exit 1

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android NDK
        run: sdkmanager "ndk;28.2.13676358"

      - name: Install Rust ARM64 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare PDF.js vendor assets
        run: pnpm --filter @readest/readest-app setup-vendors

      - name: Prefer Google Cloud Maven Central mirror for Kotlin
        run: |
          # The default Maven hosts have been returning GitHub-release 504s
          # for kotlin-compiler-embeddable 2.0.21. Try the Google-hosted mirror.
          artifact='org/jetbrains/kotlin/kotlin-compiler-embeddable/2.0.21/kotlin-compiler-embeddable-2.0.21.jar'
          curl --fail --head --location --retry 4 --retry-delay 3 \
            --connect-timeout 25 --max-time 120 \
            "https://maven-central.storage-download.googleapis.com/maven2/$artifact" \
            --output /dev/null

          mkdir -p "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/maven-central-first.gradle" <<'GRADLE'
          def gcsMirror = 'https://maven-central.storage-download.googleapis.com/maven2/'
          gradle.beforeSettings { settings ->
            settings.pluginManagement.repositories {
              maven { url = uri(gcsMirror) }
              google()
              gradlePluginPortal()
              mavenCentral()
            }
          }
          gradle.beforeProject { project ->
            project.buildscript.repositories {
              maven { url = uri(gcsMirror) }
              google()
              mavenCentral()
            }
            project.repositories {
              maven { url = uri(gcsMirror) }
              google()
              mavenCentral()
            }
          }
          GRADLE

      - name: Configure separate app identity
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'apps/readest-app/src-tauri/tauri.conf.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          config.identifier = 'com.kakabobik.readestfixed';
          config.productName = 'Readest Fixed';
          fs.writeFileSync(path, JSON.stringify(config, null, 2) + '\n');
          NODE
          echo 'NEXT_PUBLIC_APP_PLATFORM=tauri' > apps/readest-app/.env.local

      - name: Build Android debug APK (separate install)
        working-directory: apps/readest-app
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: |
          set -euo pipefail
          rm -rf src-tauri/gen/android
          pnpm tauri android init
          # Generate the missing adaptive launcher background color/resource.
          # The official Readest Android workflow also runs this after init.
          pnpm tauri icon ../../data/icons/readest-book.png
          # Tauri's init overwrites Readest's tracked Gradle/Kotlin Android
          # customizations, including the 'store' and 'pen' flavor selectors.
          # Restore the project's real Android configuration (as its official
          # release workflow does) before building.
          git restore --worktree -- src-tauri/gen/android
          # Keep the original Kotlin namespace/Activity but give the debug
          # installation its own Android application ID. This avoids replacing
          # the user's officially signed Readest installation.
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src-tauri/gen/android/app/build.gradle.kts")
          code = path.read_text()
          old = 'applicationId = "com.bilingify.readest"'
          assert code.count(old) == 1, "Upstream app ID template changed"
          assert 'missingDimensionStrategy("store", storeFlavor)' in code, "Store flavor selector missing"
          assert 'missingDimensionStrategy("pen", penFlavor)' in code, "Pen flavor selector missing"
          code = code.replace(old, 'applicationId = "com.kakabobik.readestfixed"')
          path.write_text(code)
          PY
          # Explicitly choose the original FOSS / generic-pen dependency
          # variants rather than relying on Gradle to select among four.
          # gradle.properties generated by Tauri may have no trailing newline.
          # Append one explicitly to avoid corrupting android.nonFinalResIds.
          python3 - <<'PY'
          from pathlib import Path
          props_path = Path('src-tauri/gen/android/gradle.properties')
          props = props_path.read_text()
          props = '\n'.join(line for line in props.splitlines()
                            if not line.startswith(('storeFlavor=', 'penFlavor=')))
          props_path.write_text(props.rstrip('\n') + '\nstoreFlavor=foss\npenFlavor=genericPen\n')
          assert 'android.nonFinalResIds=falsestoreFlavor' not in props_path.read_text()
          PY
          # Verify Tauri's Rust config continues to identify the test app.
          node <<'NODE'
          const fs = require('node:fs');
          const p = 'src-tauri/tauri.conf.json';
          const j = JSON.parse(fs.readFileSync(p, 'utf8'));
          if (j.identifier !== 'com.kakabobik.readestfixed')
            throw new Error('Unexpected app id after Android init');
          NODE
          # The generated Gradle wrapper defaults to a 10-second download timeout.
          # GitHub runners may need longer to fetch gradle-8.14.3-bin.zip.
          wrapper_props=src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties
          test -f "$wrapper_props"
          if grep -q '^networkTimeout=' "$wrapper_props"; then
            sed -i 's/^networkTimeout=.*/networkTimeout=300000/' "$wrapper_props"
          else
            printf '\nnetworkTimeout=300000\n' >> "$wrapper_props"
          fi
          echo 'Gradle wrapper download timeout: 300 seconds'
          # The verified archive was fetched before compilation. Read it
          # locally; neither services.gradle.org nor downloads.gradle.org is
          # safe here because both redirect to GitHub Releases (HTTP 504).
          gradle_zip="$RUNNER_TEMP/gradle-8.14.3-bin.zip"
          test -s "$gradle_zip"
          sed -i "s#^distributionUrl=.*#distributionUrl=file\\:$gradle_zip#" "$wrapper_props"
          grep '^distributionUrl=' "$wrapper_props"
          # Pin the official SHA-256 so corrupted downloads cannot be used.
          if grep -q '^distributionSha256Sum=' "$wrapper_props"; then
            sed -i 's/^distributionSha256Sum=.*/distributionSha256Sum=bd71102213493060956ec229d946beee57158dbd89d0e62b91bca0fa2c5f3531/' "$wrapper_props"
          else
            echo 'distributionSha256Sum=bd71102213493060956ec229d946beee57158dbd89d0e62b91bca0fa2c5f3531' >> "$wrapper_props"
          fi
          pnpm tauri android build --debug -t aarch64
          find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' -print

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Readest-Fixed-Android-arm64-debug
          path: apps/readest-app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
